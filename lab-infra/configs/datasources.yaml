# =============================================================================
# datasources.yaml — LABORATORIO OWASP AMASS (offline)
#
# IMPORTANTE: Amass v5 inicia TODOS los plugins API/scrape al arrancar el
# motor, aunque no tengan credenciales configuradas. Cada uno intenta salir a
# Internet. Para un laboratorio 100 % offline hay dos estrategias:
#
#   ESTRATEGIA A (recomendada, sin recompilar):
#     1) Configurar `resolvers: [192.168.56.101]` en config.yaml
#        => todo el tráfico DNS se queda en el laboratorio.
#     2) Bloquear la salida HTTP desde la VM atacante con iptables/nftables.
#        Las fuentes pasivas fallarán de forma rápida y controlada (timeout
#        corto), y el modo activo/brute seguirá funcionando perfecto.
#        Ver scripts/03-aislar-salida.sh
#
#   ESTRATEGIA B (aislamiento total del hypervisor):
#     Red host-only SIN gateway ni NAT. Entonces ni siquiera hay ruta
#     hacia Internet: las fuentes fallan de inmediato por "network
#     unreachable", sin retardar la enumeración.
#
# En el archivo se dejan comentadas las fuentes que existen en la versión
# actual para referencia; ninguna se habilita porque todas son externas.
# =============================================================================

global_options:
  minimum_ttl: 1440

