services:
  # ---------------------------------------------------------------------------
  # DNS autoritativo ficticio.
  # Servidor DNS propio con dnspython. Publica la zona "lab.local".
  # ---------------------------------------------------------------------------
  dns:
    build:
      context: .
      dockerfile: Dockerfile.dns
    container_name: amass-lab-dns
    networks:
      labnet:
        ipv4_address: 192.168.56.101
    command: ["python3", "dns_server.py", "53", "/app/zone.txt", "--verbose"]

  # ---------------------------------------------------------------------------
  # Motor + cliente de OWASP Amass en un SOLO contenedor.
  #
  # Por que juntos: en Amass v5 el motor expone una API HTTP y el cliente
  # "enum" le delega todo el trabajo. Con el motor en otro contenedor, el
  # traspaso de las semillas por bulk puede dejar al motor en un estado
  # inconsistente (panic nil-pointer en PutAsset, bug de v5.1.3). En un solo
  # contenedor el flujo "enum -> subs" es el natural y el soportado.
  # ---------------------------------------------------------------------------
  amass:
    build:
      context: .
      dockerfile: Dockerfile.amass
    container_name: amass-lab-amass
    cap_add:
      - NET_ADMIN
    environment:
      - LAB_DNS_IP=192.168.56.101
      - LAB_NET=192.168.56.0/24
      - DOMAIN=lab.local
      - AMASS_ENGINE_URL=http://127.0.0.1:4000
      # Mantiene el motor vivo despues de la enumeracion para poder consultar
      # los resultados desde otra terminal durante la demostracion.
      - LAB_KEEP_ALIVE=1
    networks:
      labnet:
        ipv4_address: 192.168.56.100
    volumes:
      - ../configs:/.config/amass
      - ../wordlists:/wl
      - ../results:/results
    depends_on:
      - dns
    # El entrypoint aplica DNAT+SNAT+iptables y luego lanza el motor.
    # NOTA: no se usa -nf. El endpoint "bulk" de la API de Amass v5.1.3 tiene
    # un panic nil-pointer (PutAsset en engine/api/server/v1/utils.go:91)
    # cuando FindEntitiesByContent devuelve una lista vacia. Ese panic mata
    # el motor. La fuerza bruta se demonstra con el wordlist del config.
    command: ["/usr/local/bin/run-amass.sh", "enum",
              "-active", "-brute", "-w", "/wl/subdomains-lab.txt",
              "-d", "lab.local", "-p", "80,443", "-timeout", "3"]

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.56.0/24
